spring.application.name=employee-mcp-server
server.port=8080

# Database Configuration (uncomment when ready to use DB)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/genai
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.hibernate.ddl-auto=update

# Gemini Embedding Configuration (uncomment when ready for similarity / vector search)
#spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
#spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001

# MCP Server Configuration
spring.ai.mcp.server.name=employee-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=SSE

# Logging Configuration
logging.level.org.springframework.ai=INFO
logging.level.org.springframework.ai.mcp=DEBUG
